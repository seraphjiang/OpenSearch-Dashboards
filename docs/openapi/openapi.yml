components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Basic authentication using OpenSearch credentials
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token authentication
    cookieAuth:
      type: apiKey
      in: cookie
      name: security_authentication
      description: Session cookie authentication
  schemas:
    Error400:
      title: Bad Request
      type: object
      required:
        - error
        - message
        - statusCode
      properties:
        error:
          type: string
          enum:
            - Bad Request
        message:
          type: string
        statusCode:
          type: integer
          enum:
            - 400
    Error401:
      title: Unauthorized
      type: object
      required:
        - error
        - message
        - statusCode
      properties:
        error:
          type: string
          enum:
            - Unauthorized
        message:
          type: string
        statusCode:
          type: integer
          enum:
            - 401
    Error403:
      title: Forbidden
      type: object
      required:
        - error
        - message
        - statusCode
      properties:
        error:
          type: string
          enum:
            - Forbidden
        message:
          type: string
        statusCode:
          type: integer
          enum:
            - 403
    Error404:
      title: Not Found
      type: object
      required:
        - error
        - message
        - statusCode
      properties:
        error:
          type: string
          enum:
            - Not Found
        message:
          type: string
        statusCode:
          type: integer
          enum:
            - 404
    Error409:
      title: Conflict
      type: object
      required:
        - error
        - message
        - statusCode
      properties:
        error:
          type: string
          enum:
            - Conflict
        message:
          type: string
        statusCode:
          type: integer
          enum:
            - 409
    Error500:
      title: Internal Server Error
      type: object
      required:
        - error
        - message
        - statusCode
      properties:
        error:
          type: string
          enum:
            - Internal Server Error
        message:
          type: string
        statusCode:
          type: integer
          enum:
            - 500
security:
  - basicAuth: []
  - bearerAuth: []
  - cookieAuth: []
