openapi: 3.0.3
info:
  version: v1
  title: OpenSearch Dashboards REST API
  contact:
    name: OpenSearch Dashboards Team
  description: |
    Complete REST API documentation for OpenSearch Dashboards.

    This specification consolidates all plugin APIs into a single reference.

    **Generated**: 2026-03-14
    **OSD Version**: 2.x

    ## Plugin APIs Included
    - Saved Objects (Core)
    - Index Patterns
    - Dashboards & Visualizations
    - Data Sources
    - Search & Query
    - Chat & AI
    - Telemetry
    - Console & Dev Tools
    - Workspace Management
    - And 15+ more plugins
servers:
  - url: http://localhost:5601
    description: Local development server
  - url: https://{host}:5601
    description: Custom OSD instance
    variables:
      host:
        default: localhost
        description: OpenSearch Dashboards host
tags:
  - name: saved objects
    description: CRUD operations for saved objects (dashboards, visualizations, etc.)
  - name: index patterns
    description: Index pattern field discovery and management
  - name: data source
    description: Multi-data source connections and management
  - name: search
    description: OpenSearch query and search APIs
  - name: query enhancements
    description: Query assist and language enhancements
  - name: chat
    description: AI-powered chat and interactions
  - name: telemetry
    description: Usage telemetry and analytics
  - name: console
    description: Dev Console and OpenSearch proxy
  - name: workspace
    description: Workspace isolation and management
  - name: visualization
    description: Visualization APIs (timeseries, timeline, etc.)
  - name: home
    description: Home screen and sample data
  - name: share
    description: URL shortening and sharing
  - name: import-export
    description: Data import/export utilities
